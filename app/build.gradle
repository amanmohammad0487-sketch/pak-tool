// AndroidIDE-compatible plugin application syntax.
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.majlish.tool'
    compileSdk 33

    defaultConfig {
        applicationId "com.majlish.tool"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }

        // Chaquopy 14.0.2 uses the python {} DSL inside defaultConfig.
        python {
            version "3.11"
            pip {
                install "requests"
                install "rich"
                install "pycryptodome"
                install "zstandard"
                install "gmalg"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}
